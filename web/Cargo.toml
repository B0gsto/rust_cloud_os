[package]
name = "web"
version = "0.1.0"
edition = "2024"

[dependencies]
gloo-net = "0.6"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Blob", "HtmlInputElement", "File", "FileList"] }
yew = { version = "0.21", features = ["csr"] }
